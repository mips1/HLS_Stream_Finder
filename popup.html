<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f9fafb;
      color: #111827;
    }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #1f2937; }
    .status { font-size: 12px; color: #6b7280; margin-bottom: 12px; word-break: break-all; }
    .url-box {
      background: #e5e7eb;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      max-height: 50px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy { background-color: #2563eb; color: white; }
    .btn-copy:hover { background-color: #1d4ed8; }
    .btn-dl { background-color: #059669; color: white; }
    .btn-dl:hover { background-color: #047857; }
    button:disabled { background-color: #d1d5db; cursor: not-allowed; }
  </style>
</head>
<body>
  <h3>HLS Stream Finder</h3>
  <div id="status" class="status">Searching for stream...</div>
  <div id="urlContainer" class="url-box" style="display:none;"></div>
  
  <button id="copyBtn" class="btn-copy" disabled>Copy index.json Link</button>
  <button id="downloadBtn" class="btn-dl" disabled>Download MP4 Stream</button>

  <script src="popup.js"></script>
</body>
</html>
