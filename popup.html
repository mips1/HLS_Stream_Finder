<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #18181b;
      color: #f4f4f5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .header h2 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      color: #ffffff;
    }

    .status-container {
      background-color: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    #status {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
      margin: 0;
      word-break: break-word;
    }

    /* Progress Bar Styles */
    .progress-container {
      margin-top: 10px;
      display: none; /* Hidden until download starts */
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: #3f3f46;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 4px;
      transition: width 0.2s ease-in-out;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    #downloadBtn {
      background-color: #10b981;
      color: #ffffff;
    }

    #downloadBtn:hover:not(:disabled) {
      background-color: #059669;
    }

    #copyBtn {
      background-color: #3f3f46;
      color: #e4e4e7;
    }

    #copyBtn:hover:not(:disabled) {
      background-color: #52525b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>HLS Stream Finder</h2>
  </div>

  <div class="status-container">
    <p id="status">Scanning page for streams...</p>
    <div id="progressContainer" class="progress-container">
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="downloadBtn" disabled>Download Video</button>
    <button id="copyBtn" disabled>Copy Stream Link</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
